server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all unknown paths serve index.html
    # React Router handles client-side routing from there
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /identity and /expenses to the Gateway
    # In Docker, 'gateway' resolves via the expenseflow-network DNS
    location /identity/ {
        proxy_pass         http://gateway:8080/identity/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Correlation-ID  $request_id;
    }

    location /expenses/ {
        proxy_pass         http://gateway:8080/expenses/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Correlation-ID  $request_id;
    }
}
